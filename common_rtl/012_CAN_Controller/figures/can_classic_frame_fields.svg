<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="620" viewBox="0 0 1900 620" role="img" aria-labelledby="title desc">
  <title id="title">Classical CAN frame field layouts</title>
  <desc id="desc">Base and extended Classical CAN data-frame fields in transmission order. The intermission is displayed outside the frame.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #475467; }
    .rowlabel { font-size: 17px; font-weight: 700; }
    .small { font-size: 13px; fill: #475467; }
    .field { stroke: #ffffff; stroke-width: 2; rx: 4; }
    .fieldtext { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .legendtext { font-size: 13px; }
    .start { fill: #e4e7ec; }
    .arb { fill: #b7e4c7; }
    .control { fill: #b8d8f8; }
    .data { fill: #d9c8f0; }
    .crc { fill: #ffd8a8; }
    .ack { fill: #f6c7c7; }
    .ifs { fill: #ffffff; stroke: #667085; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 4; }
  </style>
  <rect width="1900" height="620" fill="#ffffff"/>
  <text x="32" y="42" class="title">Classical CAN (CC) frame</text>
  <text x="32" y="67" class="subtitle">ISO 11898-1:2024 · Data-frame fields in transmission order, left to right · Base and extended formats</text>

  <g transform="translate(32,94)">
    <rect x="0" y="0" width="18" height="14" class="start field"/><text x="25" y="12" class="legendtext">Start / end</text>
    <rect x="120" y="0" width="18" height="14" class="arb field"/><text x="145" y="12" class="legendtext">Arbitration</text>
    <rect x="260" y="0" width="18" height="14" class="control field"/><text x="285" y="12" class="legendtext">Control</text>
    <rect x="365" y="0" width="18" height="14" class="data field"/><text x="390" y="12" class="legendtext">Data</text>
    <rect x="450" y="0" width="18" height="14" class="crc field"/><text x="475" y="12" class="legendtext">CRC</text>
    <rect x="525" y="0" width="18" height="14" class="ack field"/><text x="550" y="12" class="legendtext">Acknowledge</text>
  </g>

  <text x="32" y="174" class="rowlabel">Base format</text>
  <text x="32" y="198" class="small">11-bit identifier</text>
  <g class="fieldtext">
    <rect x="230" y="145" width="55" height="66" class="field start"/><text x="257" y="173"><tspan x="257">SOF</tspan><tspan x="257" dy="18">1 bit</tspan></text>
    <rect x="285" y="145" width="100" height="66" class="field arb"/><text x="335" y="173"><tspan x="335">ID[10:0]</tspan><tspan x="335" dy="18">11 bits</tspan></text>
    <rect x="385" y="145" width="65" height="66" class="field arb"/><text x="417" y="173"><tspan x="417">RTR</tspan><tspan x="417" dy="18">1 bit</tspan></text>
    <rect x="450" y="145" width="60" height="66" class="field control"/><text x="480" y="173"><tspan x="480">IDE=0</tspan><tspan x="480" dy="18">1 bit</tspan></text>
    <rect x="510" y="145" width="55" height="66" class="field control"/><text x="537" y="173"><tspan x="537">r0</tspan><tspan x="537" dy="18">1 bit</tspan></text>
    <rect x="565" y="145" width="70" height="66" class="field control"/><text x="600" y="173"><tspan x="600">DLC</tspan><tspan x="600" dy="18">4 bits</tspan></text>
    <rect x="635" y="145" width="130" height="66" class="field data"/><text x="700" y="173"><tspan x="700">Data field</tspan><tspan x="700" dy="18">0–8 bytes</tspan></text>
    <rect x="765" y="145" width="95" height="66" class="field crc"/><text x="812" y="173"><tspan x="812">CRC sequence</tspan><tspan x="812" dy="18">15 bits</tspan></text>
    <rect x="860" y="145" width="80" height="66" class="field crc"/><text x="900" y="173"><tspan x="900">CRC delim.</tspan><tspan x="900" dy="18">1 bit</tspan></text>
    <rect x="940" y="145" width="70" height="66" class="field ack"/><text x="975" y="173"><tspan x="975">ACK slot</tspan><tspan x="975" dy="18">1 bit</tspan></text>
    <rect x="1010" y="145" width="80" height="66" class="field ack"/><text x="1050" y="173"><tspan x="1050">ACK delim.</tspan><tspan x="1050" dy="18">1 bit</tspan></text>
    <rect x="1090" y="145" width="55" height="66" class="field start"/><text x="1117" y="173"><tspan x="1117">EOF</tspan><tspan x="1117" dy="18">7 bits</tspan></text>
    <rect x="1160" y="145" width="105" height="66" class="ifs"/><text x="1212" y="173"><tspan x="1212">Intermission</tspan><tspan x="1212" dy="18">3 bits · outside</tspan></text>
  </g>

  <text x="32" y="344" class="rowlabel">Extended format</text>
  <text x="32" y="368" class="small">29-bit identifier</text>
  <g class="fieldtext">
    <rect x="230" y="315" width="55" height="66" class="field start"/><text x="257" y="343"><tspan x="257">SOF</tspan><tspan x="257" dy="18">1 bit</tspan></text>
    <rect x="285" y="315" width="95" height="66" class="field arb"/><text x="332" y="343"><tspan x="332">ID-A[10:0]</tspan><tspan x="332" dy="18">11 bits</tspan></text>
    <rect x="380" y="315" width="55" height="66" class="field arb"/><text x="407" y="343"><tspan x="407">SRR=1</tspan><tspan x="407" dy="18">1 bit</tspan></text>
    <rect x="435" y="315" width="55" height="66" class="field arb"/><text x="462" y="343"><tspan x="462">IDE=1</tspan><tspan x="462" dy="18">1 bit</tspan></text>
    <rect x="490" y="315" width="95" height="66" class="field arb"/><text x="537" y="343"><tspan x="537">ID-B[17:0]</tspan><tspan x="537" dy="18">18 bits</tspan></text>
    <rect x="585" y="315" width="60" height="66" class="field arb"/><text x="615" y="343"><tspan x="615">RTR</tspan><tspan x="615" dy="18">1 bit</tspan></text>
    <rect x="645" y="315" width="55" height="66" class="field control"/><text x="672" y="343"><tspan x="672">r1</tspan><tspan x="672" dy="18">1 bit</tspan></text>
    <rect x="700" y="315" width="55" height="66" class="field control"/><text x="727" y="343"><tspan x="727">r0</tspan><tspan x="727" dy="18">1 bit</tspan></text>
    <rect x="755" y="315" width="65" height="66" class="field control"/><text x="787" y="343"><tspan x="787">DLC</tspan><tspan x="787" dy="18">4 bits</tspan></text>
    <rect x="820" y="315" width="120" height="66" class="field data"/><text x="880" y="343"><tspan x="880">Data field</tspan><tspan x="880" dy="18">0–8 bytes</tspan></text>
    <rect x="940" y="315" width="90" height="66" class="field crc"/><text x="985" y="343"><tspan x="985">CRC sequence</tspan><tspan x="985" dy="18">15 bits</tspan></text>
    <rect x="1030" y="315" width="75" height="66" class="field crc"/><text x="1067" y="343"><tspan x="1067">CRC delim.</tspan><tspan x="1067" dy="18">1 bit</tspan></text>
    <rect x="1105" y="315" width="65" height="66" class="field ack"/><text x="1137" y="343"><tspan x="1137">ACK slot</tspan><tspan x="1137" dy="18">1 bit</tspan></text>
    <rect x="1170" y="315" width="75" height="66" class="field ack"/><text x="1207" y="343"><tspan x="1207">ACK delim.</tspan><tspan x="1207" dy="18">1 bit</tspan></text>
    <rect x="1245" y="315" width="55" height="66" class="field start"/><text x="1272" y="343"><tspan x="1272">EOF</tspan><tspan x="1272" dy="18">7 bits</tspan></text>
    <rect x="1315" y="315" width="105" height="66" class="ifs"/><text x="1367" y="343"><tspan x="1367">Intermission</tspan><tspan x="1367" dy="18">3 bits · outside</tspan></text>
  </g>

  <line x1="32" y1="425" x2="1868" y2="425" stroke="#d0d5dd"/>
  <text x="32" y="456" class="small">Interpretation:</text>
  <text x="130" y="456" class="small">Logical field boxes are not to scale. Dynamic stuff bits are inserted on the wire after five consecutive equal bits, from SOF through the CRC sequence; they are not separate logical fields.</text>
  <text x="32" y="484" class="small">Remote-frame variant:</text>
  <text x="190" y="484" class="small">RTR is recessive and the data field is absent. The intermission consists of three recessive bits after EOF and is not part of the frame.</text>
  <text x="32" y="548" class="small">Source: ISO 11898-1:2024 §6.6.10.</text>
</svg>
