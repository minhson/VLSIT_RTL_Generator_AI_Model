<text x="12" y="200" font-size="11" fill="#444">Four independent cases, two bits each (the bit before and the monitored bit). A recessive bit sent in the arbitration field and read dominant is a loss of arbitration, not an error; a recessive bit sent in the control field and read dominant is a bit error; a recessive bit in the ACK slot read dominant is the acknowledge; a dominant bit sent in the data field and read recessive is a bit error (REF-001 section 6.1).</text>
