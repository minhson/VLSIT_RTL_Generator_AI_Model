<text x="12" y="320" font-size="11" fill="#444">One cell is one i_clk_can period, one tq.min; a data-phase time quantum at dbrp=1 is two cells. The loop delay of 6 clock periods is measured as tdcv = 6 (not 3 time quanta). The SSP is tdcv + tdco = 8 clock periods after the transmit point and samples the delayed echo of that bit. Latency values are illustrative.</text>
