<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="10" y="20" font-family="Times New Roman, serif"  font-size="16" font-weight="bold" text-anchor="start">Logic diagram of the transmit path (m_canfd_txh, CLK-BUS)</text><rect x="20" y="60" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="115" y="90" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Request, cancel, done flags</text><text x="115" y="105" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">cfd_txb_req, cfd_txb_cancel</text><text x="115" y="120" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">cfd_txb_done, cfd_txb_cdone</text><rect x="270" y="60" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="365" y="90" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Key cache</text><text x="365" y="105" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">identifier, PRIO, RTL, TRTX,</text><text x="365" y="120" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">EFC, valid, retry counter</text><path d="M 210 100 L 270 100" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="270,100 261,104 261,96" fill="#000"/><text x="214" y="93" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">request</text><rect x="520" y="60" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="615" y="90" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Scan and priority</text><text x="615" y="105" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">candidates only, one per clock</text><text x="615" y="120" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">express first, key of 10.12.3</text><path d="M 460 100 L 520 100" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="520,100 511,104 511,96" fill="#000"/><rect x="770" y="60" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="865" y="90" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">FIFO / queue select</text><text x="865" y="105" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">FIFO: head from get index</text><text x="865" y="120" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">queue: lowest key</text><path d="M 710 100 L 770 100" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="770,100 761,104 761,96" fill="#000"/><rect x="1020" y="60" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1115" y="98" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Fetch sequencer</text><text x="1115" y="112" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">header and data words</text><path d="M 960 100 L 1020 100" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1020,100 1011,104 1011,96" fill="#000"/><rect x="1020" y="200" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1115" y="230" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Message RAM master</text><text x="1115" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">u_mram</text><text x="1115" y="260" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">one request at a time</text><path d="M 1115 140 L 1115 200" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1115,200 1111,191 1119,191" fill="#000"/><text x="1123" y="175" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">read</text><rect x="770" y="200" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="865" y="230" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Tx transfer register(s)</text><text x="865" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">current (and next with</text><text x="865" y="260" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">PARA_CANFD_TX_PREFETCH)</text><path d="M 1060 280 L 1060 300 L 865 300 L 865 280" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="865,280 869,289 861,289" fill="#000"/><text x="940" y="294" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">words</text><rect x="520" y="200" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="615" y="230" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Crossing CDC-006</text><text x="615" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">four-phase handshake</text><text x="615" y="260" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">to m_canfd_bsp</text><path d="M 770 240 L 710 240" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="710,240 719,236 719,244" fill="#000"/><rect x="270" y="200" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="365" y="230" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Frame engine result</text><text x="365" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">sent, lost arbitration,</text><text x="365" y="260" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">error (from m_canfd_bsp)</text><path d="M 520 260 L 460 260" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="460,260 469,256 469,264" fill="#000"/><text x="478" y="252" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">result</text><rect x="20" y="200" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="115" y="230" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Retry control</text><text x="115" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">RTL and cfd_txr_cfg.retry_max</text><text x="115" y="260" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">counter per buffer</text><path d="M 270 240 L 210 240" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="210,240 219,236 219,244" fill="#000"/><path d="M 115 200 L 115 140" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="115,140 119,149 111,149" fill="#000"/><text x="123" y="175" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">clear, cancel, fail</text><rect x="770" y="340" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="865" y="370" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Trigger transmit</text><text x="865" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">data request, confirm</text><text x="865" y="400" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">(PARA_CANFD_TRTX_EN)</text><path d="M 865 340 L 865 280" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="865,280 869,289 861,289" fill="#000"/><rect x="270" y="340" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="365" y="370" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Tx event writer</text><text x="365" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">identifier, marker,</text><text x="365" y="400" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">type, timestamp</text><path d="M 365 280 L 365 340" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="365,340 361,331 369,331" fill="#000"/><rect x="520" y="340" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="615" y="370" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Tx event FIFO</text><text x="615" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">put, get, fill, full, lost</text><text x="615" y="400" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">full: event lost, frame sent</text><path d="M 460 380 L 520 380" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="520,380 511,384 511,376" fill="#000"/><rect x="20" y="340" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="115" y="370" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Events</text><text x="115" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">tx_done, tx_can, tx_emp,</text><text x="115" y="400" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">txe_new, txe_wm, txe_ful</text><path d="M 270 380 L 210 380" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="210,380 219,376 219,384" fill="#000"/><text x="20" y="520" font-family="Times New Roman, serif"  font-size="12"  text-anchor="start">A pending buffer is never changed by the IP; software must not change it either. Only a candidate (request set, header cached, data valid) is fetched and sent.</text></svg>