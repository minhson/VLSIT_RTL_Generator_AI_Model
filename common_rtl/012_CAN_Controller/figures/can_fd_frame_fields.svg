<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="720" viewBox="0 0 2200 720" role="img" aria-labelledby="title desc">
  <title id="title">CAN FD frame field layouts</title>
  <desc id="desc">Base and extended CAN FD data-frame fields in transmission order. The intermission is outside the frame.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #475467; }
    .rowlabel { font-size: 17px; font-weight: 700; }
    .small { font-size: 13px; fill: #475467; }
    .field { stroke: #ffffff; stroke-width: 2; rx: 4; }
    .fieldtext { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .legendtext { font-size: 13px; }
    .start { fill: #e4e7ec; }
    .arb { fill: #b7e4c7; }
    .control { fill: #b8d8f8; }
    .data { fill: #d9c8f0; }
    .crc { fill: #ffd8a8; }
    .ack { fill: #f6c7c7; }
    .ifs { fill: #ffffff; stroke: #667085; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 4; }
  </style>
  <rect width="2200" height="720" fill="#ffffff"/>
  <text x="32" y="42" class="title">CAN FD frame</text>
  <text x="32" y="67" class="subtitle">ISO 11898-1:2024 · ISO CAN FD data-frame fields in transmission order, left to right · Base and extended formats</text>

  <g transform="translate(32,94)">
    <rect x="0" y="0" width="18" height="14" class="field start"/><text x="25" y="12" class="legendtext">Start / end</text>
    <rect x="120" y="0" width="18" height="14" class="field arb"/><text x="145" y="12" class="legendtext">Arbitration</text>
    <rect x="260" y="0" width="18" height="14" class="field control"/><text x="285" y="12" class="legendtext">Control</text>
    <rect x="365" y="0" width="18" height="14" class="field data"/><text x="390" y="12" class="legendtext">Data</text>
    <rect x="450" y="0" width="18" height="14" class="field crc"/><text x="475" y="12" class="legendtext">CRC</text>
    <rect x="525" y="0" width="18" height="14" class="field ack"/><text x="550" y="12" class="legendtext">Acknowledge</text>
  </g>

  <text x="32" y="174" class="rowlabel">Base format</text>
  <text x="32" y="198" class="small">11-bit identifier</text>
  <g class="fieldtext">
    <rect x="230" y="145" width="55" height="68" class="field start"/><text x="257" y="174"><tspan x="257">SOF</tspan><tspan x="257" dy="19">1 · dominant</tspan></text>
    <rect x="285" y="145" width="110" height="68" class="field arb"/><text x="340" y="174"><tspan x="340">ID[10:0]</tspan><tspan x="340" dy="19">11 bits</tspan></text>
    <rect x="395" y="145" width="65" height="68" class="field arb"/><text x="427" y="174"><tspan x="427">RRS</tspan><tspan x="427" dy="19">dominant</tspan></text>
    <rect x="460" y="145" width="65" height="68" class="field control"/><text x="492" y="174"><tspan x="492">IDE</tspan><tspan x="492" dy="19">dominant</tspan></text>
    <rect x="525" y="145" width="65" height="68" class="field control"/><text x="557" y="174"><tspan x="557">FDF</tspan><tspan x="557" dy="19">recessive</tspan></text>
    <rect x="590" y="145" width="65" height="68" class="field control"/><text x="622" y="174"><tspan x="622">res</tspan><tspan x="622" dy="19">dominant</tspan></text>
    <rect x="655" y="145" width="75" height="68" class="field control"/><text x="692" y="174"><tspan x="692">BRS</tspan><tspan x="692" dy="19">rate switch</tspan></text>
    <rect x="730" y="145" width="75" height="68" class="field control"/><text x="767" y="174"><tspan x="767">ESI</tspan><tspan x="767" dy="19">error state</tspan></text>
    <rect x="805" y="145" width="70" height="68" class="field control"/><text x="840" y="174"><tspan x="840">DLC</tspan><tspan x="840" dy="19">4 bits</tspan></text>
    <rect x="875" y="145" width="125" height="68" class="field data"/><text x="937" y="174"><tspan x="937">Data field</tspan><tspan x="937" dy="19">0–64 bytes</tspan></text>
    <rect x="1000" y="145" width="120" height="68" class="field crc"/><text x="1060" y="174"><tspan x="1060">SBC</tspan><tspan x="1060" dy="19">4 bits</tspan></text>
    <rect x="1120" y="145" width="155" height="68" class="field crc"/><text x="1197" y="174"><tspan x="1197">FCRC sequence</tspan><tspan x="1197" dy="19">CRC17 / CRC21</tspan></text>
    <rect x="1275" y="145" width="90" height="68" class="field crc"/><text x="1320" y="174"><tspan x="1320">CRC delim.</tspan><tspan x="1320" dy="19">1 bit</tspan></text>
    <rect x="1365" y="145" width="75" height="68" class="field ack"/><text x="1402" y="174"><tspan x="1402">ACK slot</tspan><tspan x="1402" dy="19">1 bit</tspan></text>
    <rect x="1440" y="145" width="90" height="68" class="field ack"/><text x="1485" y="174"><tspan x="1485">ACK delim.</tspan><tspan x="1485" dy="19">1 bit</tspan></text>
    <rect x="1530" y="145" width="65" height="68" class="field start"/><text x="1562" y="174"><tspan x="1562">EOF</tspan><tspan x="1562" dy="19">7 bits</tspan></text>
    <rect x="1605" y="145" width="125" height="68" class="ifs"/><text x="1667" y="174"><tspan x="1667">Intermission</tspan><tspan x="1667" dy="19">3 bits · outside</tspan></text>
  </g>

  <text x="32" y="344" class="rowlabel">Extended format</text>
  <text x="32" y="368" class="small">29-bit identifier</text>
  <g class="fieldtext">
    <rect x="230" y="315" width="55" height="68" class="field start"/><text x="257" y="344"><tspan x="257">SOF</tspan><tspan x="257" dy="19">1 · dominant</tspan></text>
    <rect x="285" y="315" width="95" height="68" class="field arb"/><text x="332" y="344"><tspan x="332">ID-A[10:0]</tspan><tspan x="332" dy="19">11 bits</tspan></text>
    <rect x="380" y="315" width="60" height="68" class="field arb"/><text x="410" y="344"><tspan x="410">SRR</tspan><tspan x="410" dy="19">recessive</tspan></text>
    <rect x="440" y="315" width="60" height="68" class="field arb"/><text x="470" y="344"><tspan x="470">IDE</tspan><tspan x="470" dy="19">recessive</tspan></text>
    <rect x="500" y="315" width="110" height="68" class="field arb"/><text x="555" y="344"><tspan x="555">ID-B[17:0]</tspan><tspan x="555" dy="19">18 bits</tspan></text>
    <rect x="610" y="315" width="70" height="68" class="field arb"/><text x="645" y="344"><tspan x="645">RRS</tspan><tspan x="645" dy="19">dominant</tspan></text>
    <rect x="680" y="315" width="70" height="68" class="field control"/><text x="715" y="344"><tspan x="715">FDF</tspan><tspan x="715" dy="19">recessive</tspan></text>
    <rect x="750" y="315" width="65" height="68" class="field control"/><text x="782" y="344"><tspan x="782">res</tspan><tspan x="782" dy="19">dominant</tspan></text>
    <rect x="815" y="315" width="75" height="68" class="field control"/><text x="852" y="344"><tspan x="852">BRS</tspan><tspan x="852" dy="19">rate switch</tspan></text>
    <rect x="890" y="315" width="75" height="68" class="field control"/><text x="927" y="344"><tspan x="927">ESI</tspan><tspan x="927" dy="19">error state</tspan></text>
    <rect x="965" y="315" width="70" height="68" class="field control"/><text x="1000" y="344"><tspan x="1000">DLC</tspan><tspan x="1000" dy="19">4 bits</tspan></text>
    <rect x="1035" y="315" width="125" height="68" class="field data"/><text x="1097" y="344"><tspan x="1097">Data field</tspan><tspan x="1097" dy="19">0–64 bytes</tspan></text>
    <rect x="1160" y="315" width="120" height="68" class="field crc"/><text x="1220" y="344"><tspan x="1220">SBC</tspan><tspan x="1220" dy="19">4 bits</tspan></text>
    <rect x="1280" y="315" width="155" height="68" class="field crc"/><text x="1357" y="344"><tspan x="1357">FCRC sequence</tspan><tspan x="1357" dy="19">CRC17 / CRC21</tspan></text>
    <rect x="1435" y="315" width="90" height="68" class="field crc"/><text x="1480" y="344"><tspan x="1480">CRC delim.</tspan><tspan x="1480" dy="19">1 bit</tspan></text>
    <rect x="1525" y="315" width="75" height="68" class="field ack"/><text x="1562" y="344"><tspan x="1562">ACK slot</tspan><tspan x="1562" dy="19">1 bit</tspan></text>
    <rect x="1600" y="315" width="90" height="68" class="field ack"/><text x="1645" y="344"><tspan x="1645">ACK delim.</tspan><tspan x="1645" dy="19">1 bit</tspan></text>
    <rect x="1690" y="315" width="65" height="68" class="field start"/><text x="1722" y="344"><tspan x="1722">EOF</tspan><tspan x="1722" dy="19">7 bits</tspan></text>
    <rect x="1765" y="315" width="125" height="68" class="ifs"/><text x="1827" y="344"><tspan x="1827">Intermission</tspan><tspan x="1827" dy="19">3 bits · outside</tspan></text>
  </g>

  <line x1="32" y1="430" x2="2168" y2="430" stroke="#d0d5dd"/>
  <text x="32" y="460" class="small">Control fields: FDF is recessive (FD format), res is dominant; BRS recessive switches to the data bit rate, while dominant keeps the nominal rate.</text>
  <text x="32" y="486" class="small">ESI: dominant = error-active, recessive = error-passive. DLC maps to 0–8, 12, 16, 20, 24, 32, 48, or 64 data bytes.</text>
  <text x="32" y="512" class="small">CRC field: SBC is 3-bit Gray code plus parity; CRC17 is used for payloads up to 16 bytes, CRC21 for payloads above 16 bytes.</text>
  <text x="32" y="538" class="small">Logical boxes are not to scale. Dynamic stuff bits run from SOF through the data field; fixed stuff bits are interspersed in the CRC field per ISO.</text>
  <text x="32" y="564" class="small">The stuff-count value covers dynamic stuff bits before the first fixed stuff bit. Fixed stuff bits are excluded from the CRC calculation.</text>
  <text x="32" y="590" class="small">CAN FD has no remote-frame format. The 3-bit recessive intermission follows EOF and is not part of the frame.</text>
  <text x="32" y="644" class="small">Source: ISO 11898-1:2024 §6.6.11.</text>
</svg>
