<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="10" y="20" font-family="Times New Roman, serif"  font-size="16" font-weight="bold" text-anchor="start">Logic diagram of the receive path (m_canfd_rxh, m_canfd_flt, CLK-BUS)</text><rect x="20" y="60" width="170" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="105" y="85" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Transfer registers</text><text x="105" y="100" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">1 or 2 registers</text><text x="105" y="115" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">(from CDC-005)</text><rect x="250" y="60" width="170" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="335" y="85" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Pre-checks</text><text x="335" y="100" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">remote frame rule</text><text x="335" y="115" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">FD or Classic, DLC</text><path d="M 190 95 L 250 95" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="250,95 241,99 241,91" fill="#000"/><rect x="480" y="60" width="190" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="575" y="85" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Filter walker (m_canfd_flt)</text><text x="575" y="100" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">one element per RAM read</text><text x="575" y="115" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">std list or ext list</text><path d="M 420 95 L 480 95" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="480,95 471,99 471,91" fill="#000"/><rect x="480" y="190" width="190" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="575" y="215" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Element compare</text><text x="575" y="230" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">range, dual, mask</text><text x="575" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">XIDAM for extended ids</text><path d="M 575 130 L 575 190" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="575,190 571,181 579,181" fill="#000"/><text x="583" y="165" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">element</text><rect x="730" y="190" width="170" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="815" y="215" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">First match</text><text x="815" y="230" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">action, filter index</text><text x="815" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">no match: global rule</text><path d="M 670 225 L 730 225" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="730,225 721,229 721,221" fill="#000"/><rect x="730" y="60" width="170" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="815" y="85" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Message RAM master</text><text x="815" y="100" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">u_mram (one request)</text><text x="815" y="115" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">at a time</text><path d="M 670 95 L 730 95" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="730,95 721,99 721,91" fill="#000"/><text x="685" y="88" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">read</text><path d="M 815 130 L 815 190" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="815,190 811,181 819,181" fill="#000"/><text x="823" y="165" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">element word</text><rect x="960" y="190" width="240" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1080" y="215" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Action decode</text><text x="1080" y="230" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">FIFO 0, FIFO 1, buffer n,</text><text x="1080" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">high priority, reject</text><path d="M 900 225 L 960 225" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="960,225 951,229 951,221" fill="#000"/><rect x="960" y="320" width="240" height="90" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1080" y="348" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Store sequencer</text><text x="1080" y="363" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">data words first, then the</text><text x="1080" y="377" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">header word with the generation,</text><text x="1080" y="392" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">then put index / new-data flag</text><path d="M 1080 260 L 1080 320" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1080,320 1076,311 1084,311" fill="#000"/><path d="M 960 345 L 930 345 L 930 95 L 900 95" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="900,95 909,91 909,99" fill="#000"/><text x="870" y="80" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">write words</text><rect x="480" y="320" width="190" height="90" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="575" y="355" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">FIFO state</text><text x="575" y="370" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">get, put, fill, full, lost</text><text x="575" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">watermark, overwrite mode</text><path d="M 960 380 L 670 380" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="670,380 679,376 679,384" fill="#000"/><text x="780" y="396" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">put update</text><rect x="20" y="320" width="200" height="90" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="120" y="348" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Status and events</text><text x="120" y="363" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">rxN_new, rxN_wm, rxN_ful,</text><text x="120" y="377" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">rxN_lst, rxb_new, hpm,</text><text x="120" y="392" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">cfd_rx_sts.ovr</text><path d="M 480 365 L 220 365" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="220,365 229,361 229,369" fill="#000"/><rect x="250" y="320" width="170" height="90" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="335" y="355" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">DMA request</text><text x="335" y="370" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">fill &gt;= watermark</text><text x="335" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">(m_canfd_dma)</text><path d="M 480 395 L 420 395" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="420,395 429,391 429,399" fill="#000"/><text x="20" y="520" font-family="Times New Roman, serif"  font-size="12"  text-anchor="start">The handler takes the oldest frame of the transfer registers, filters it, stores it and releases the register; a frame that completes while no register is free is lost and sets ovr.</text></svg>