<text x="12" y="170" font-size="11" fill="#444">A node that finds a CRC error does not acknowledge the frame and starts its error flag at the bit after the ACK delimiter (columns 4 to 9). For a bit, stuff, form or acknowledge error the flag starts at the next bit (WF-007). An error-active node sends 6 dominant bits, an error-passive node 6 recessive bits.</text>
