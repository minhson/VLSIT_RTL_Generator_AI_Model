<text x="12" y="290" font-size="11" fill="#444">An FD frame whose SOF occurs in an event-driven window remains eligible through EOF even if the window changes to strict TT mid-frame. An FD SOF in a strict TT window is rejected as a form error. FD Tx starts only in event-driven windows; Classic Tx may use the configured TT schedule. Symbolic cycles illustrate ordering only, not bit timing. DEC-072, REQ-TT-018. TTCAN-like product profile; no ISO 11898-4 conformance claim.</text>
