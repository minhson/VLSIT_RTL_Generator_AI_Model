imes New Roman, serif"  font-size="11"  text-anchor="start">crc ok</text><path d="M 830 90 L 830 200 L 190 200 L 190 440 L 170 440" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="170,440 179,436 179,444" fill="#000"/><text x="220" y="194" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">tx_bit (to the sample point)</text><path d="M 305 310 L 305 335 L 200 335 L 200 470 L 170 470" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="170,470 179,466 179,474" fill="#000"/><text x="210" y="330" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">sample_val</text><path d="M 790 455 L 1120 455 L 1120 120" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1120,120 1124,129 1116,129" fill="#000"/><text x="900" y="447" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">ack_drive</text><rect x="860" y="520" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="960" y="548" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Error event bus</text><text x="960" y="562" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">type, phase, role</text><path d="M 95 490 L 95 550 L 860 550" fill="none" stroke="#000" stroke-width="1.4"/><path d="M 295 490 L 295 550" fill="none" stroke="#000" stroke-width="1.4"/><path d="M 495 490 L 495 550" fill="none" stroke="#000" stroke-width="1.4"/><path d="M 840 550 L 860 550" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="860,550 851,554 851,546" fill="#000"/><path d="M 1060 550 L 1200 550" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1200,550 1191,554 1191,546" fill="#000"/><text x="1090" y="543" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">to m_canfd_eml</text><text x="20" y="620" font-family="Times New Roman, serif"  font-size="12"  text-anchor="start">The receive path and the transmit path