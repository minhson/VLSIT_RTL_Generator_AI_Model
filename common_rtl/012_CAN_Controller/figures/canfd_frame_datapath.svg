<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="10" y="20" font-family="Times New Roman, serif"  font-size="16" font-weight="bold" text-anchor="start">Logic diagram of the frame engine datapath m_canfd_bsp (CLK-CAN)</text><rect x="20" y="60" width="150" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="95" y="80" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Tx frame register</text><text x="95" y="95" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">(from m_canfd_txh</text><text x="95" y="110" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">through CDC-006)</text><rect x="220" y="60" width="170" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="305" y="80" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Field sequencer</text><text x="305" y="95" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">SOF, ID, control, data,</text><text x="305" y="110" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">CRC, ACK, EOF</text><path d="M 170 90 L 220 90" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="220,90 211,94 211,86" fill="#000"/><rect x="440" y="40" width="150" height="50" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="515" y="63" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">CRC generator</text><text x="515" y="77" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">CRC15 / CRC17 / CRC21</text><rect x="440" y="110" width="150" height="50" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="515" y="133" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Stuff count</text><text x="515" y="147" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">mod 8, Gray + parity</text><path d="M 390 75 L 440 65" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="440,65 435,78 427,70" fill="#000"/><text x="398" y="62" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">bit</text><path d="M 390 105 L 440 135" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="440,135 427,130 435,122" fill="#000"/><rect x="650" y="60" width="150" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="725" y="80" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Stuffing</text><text x="725" y="95" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">dynamic: 5 equal bits</text><text x="725" y="110" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">fixed: in CRC field</text><path d="M 590 65 L 650 75" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="650,75 637,70 645,62" fill="#000"/><path d="M 590 135 L 650 105" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="650,105 645,118 637,110" fill="#000"/><rect x="860" y="60" width="140" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="930" y="88" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">o_can_tx register</text><text x="930" y="102" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">(loaded at tx_point)</text><path d="M 800 90 L 860 90" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="860,90 851,94 851,86" fill="#000"/><text x="805" y="82" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">tx_bit</text><rect x="1040" y="60" width="170" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1125" y="80" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Output override</text><text x="1125" y="95" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">error flag, delimiter,</text><text x="1125" y="110" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">overload, ACK dominant</text><path d="M 1040 90 L 1000 90" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1000,90 1009,86 1009,94" fill="#000"/><rect x="20" y="250" width="150" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="95" y="278" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">i_can_rx</text><text x="95" y="292" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">rx_cur (m_canfd_btl)</text><rect x="220" y="250" width="170" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="305" y="270" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Sampler</text><text x="305" y="285" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">sample_val at the</text><text x="305" y="300" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">sample point (or ssp)</text><path d="M 170 280 L 220 280" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="220,280 211,284 211,276" fill="#000"/><rect x="440" y="250" width="150" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="515" y="270" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Destuffer</text><text x="515" y="285" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">drop stuff bits</text><text x="515" y="300" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">stuff error: 6th equal</text><path d="M 390 280 L 440 280" fill="none" stroke="#000" stroke-width="1.4"/><polygon p