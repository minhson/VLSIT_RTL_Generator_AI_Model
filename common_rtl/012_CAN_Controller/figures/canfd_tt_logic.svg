<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="10" y="20" font-family="Times New Roman, serif"  font-size="16" font-weight="bold" text-anchor="start">Logic diagram of the TTCAN frame synchronization entity (m_canfd_tt, CLK-CAN)</text><rect x="20" y="60" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="115" y="90" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">NTU generator</text><text x="115" y="105" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">accumulator: + DenomCfg,</text><text x="115" y="120" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">tick at NumAct (8 micro ticks)</text><rect x="270" y="60" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="365" y="90" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Local time</text><text x="365" y="105" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">16-bit macro tick +</text><text x="365" y="120" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">3-bit micro tick</text><path d="M 210 100 L 270 100" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="270,100 261,104 261,96" fill="#000"/><text x="230" y="92" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">tick</text><rect x="520" y="60" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="615" y="90" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Sync_Mark and Ref_Mark</text><text x="615" y="105" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">Sync_Mark at the SOF sample</text><text x="615" y="120" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">point; Ref_Mark at a valid RM</text><path d="M 460 100 L 520 100" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="520,100 511,104 511,96" fill="#000"/><rect x="770" y="60" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="865" y="90" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Cycle time</text><text x="865" y="105" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">local time - Ref_Mark</text><text x="865" y="120" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">(restarts at each RM)</text><path d="M 710 100 L 770 100" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="770,100 761,104 761,96" fill="#000"/><rect x="1020" y="60" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1115" y="90" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Global time (level 2)</text><text x="1115" y="105" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">local time + Local_Offset</text><text x="1115" y="120" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">low-pass filtered</text><path d="M 960 100 L 1020 100" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1020,100 1011,104 1011,96" fill="#000"/><rect x="1020" y="200" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1115" y="230" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Drift compensation</text><text x="1115" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">NumAct = NumAct x dLocal / dMaster</text><text x="1115" y="260" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">inside SDL, Disc bit</text><path d="M 1115 140 L 1115 200" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1115,200 1111,191 1119,191" fill="#000"/><path d="M 1115 280 L 1115 310 L 15 310 L 15 100 L 20 100" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="20,100 11,104 11,96" fill="#000"/><text x="560" y="304" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">NumAct</text><rect x="770" y="200" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="865" y="230" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Trigger sequencer</text><text x="865" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">next trigger: cycle code match,</text><text x="865" y="260" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">time mark = cycle time</text><path d="M 865 140 L 865 200" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="865,200 861,191 869,191" fill="#000"/><text x="873" y="175" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">cycle time</text><rect x="520" y="200" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="615" y="230" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Trigger cache</text><text x="615" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">PARA_CANFD_TRIG_NUM words in</text><text x="615" y="260" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">flops, parity, loaded in TT config</text><path d="M 710 240 L 770 240" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="770,240 761,244 761,236" fill="#000"/><text x="716" y="232" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">triggers</text><rect x="270" y="200" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="365" y="230" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Window control</text><text x="365" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">Tx_Enable window (TEW),</text><text x="365" y="260" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">single, merged, exclusive</text><path d="M 865 280 L 865 300 L 400 300 L 400 280" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="400,280 404,289 396,289" fill="#000"/><text x="560" y="294" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">trigger events</text><rect x="20" y="200" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="115" y="230" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Interface to m_canfd_txh</text><text x="115" y="245" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">time-triggered request,</text><text x="115" y="260" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">start allowed, periodic flags</text><path d="M 270 240 L 210 240" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="210,240 219,236 219,244" fill="#000"/><rect x="270" y="340" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="365" y="370" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Reference message</text><text x="365" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">build (master) and parse</text><text x="365" y="400" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">(cycle count, Next_is_Gap, mark)</text><path d="M 365 280 L 365 340" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="365,340 361,331 369,331" fill="#000"/><rect x="520" y="340" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="615" y="370" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Sync and master state</text><text x="615" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">out of sync, synchronising,</text><text x="615" y="400" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">in schedule, in gap; master priority</text><path d="M 460 380 L 520 380" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="520,380 511,384 511,376" fill="#000"/><rect x="770" y="340" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="865" y="370" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Gap control</text><text x="865" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">nig, fgp, tmg, event pin</text><text x="865" y="400" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">(event-synchronised mode)</text><path d="M 770 380 L 710 380" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="710,380 719,376 719,384" fill="#000"/><rect x="1020" y="340" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1115" y="370" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Application watchdog</text><text x="1115" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">limit x 256 NTU,</text><text x="1115" y="400" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">served by software</text><rect x="20" y="340" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="115" y="370" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Error level and interrupts</text><text x="115" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">S0 to S3, 16 sources,</text><text x="115" y="400" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">fatal: bus monitoring mode</text><path d="M 270 380 L 210 380" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="210,380 219,376 219,384" fill="#000"/><rect x="20" y="480" width="440" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="240" y="513" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Stopwatch and time mark: capture of local, cycle or global time at the trigger pins;</text><text x="240" y="527" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">time mark compare for the time-mark interrupt</text><text x="20" y="610" font-family="Times New Roman, serif"  font-size="12"  text-anchor="start">The unit works on the CAN clock. Configuration is copied from the BUS domain only while INIT = 1 (CDC-003); events and status leave through CDC-007 and CDC-004.</text></svg>