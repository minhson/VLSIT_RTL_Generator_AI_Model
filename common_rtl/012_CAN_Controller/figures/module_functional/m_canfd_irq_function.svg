<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc"><title id="title">Functional diagram of m_canfd_irq</title><desc id="desc">Inputs, main processing stages, outputs and clock domain for m_canfd_irq.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#101828" font-weight="bold" text-anchor="start">m_canfd_irq · Functional block diagram</text><text x="30" y="72" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475467" font-weight="normal" text-anchor="start">CLK-BUS  |  Latch, mask and route interrupt events</text><rect x="30" y="145" width="260" height="245" rx="12" fill="#f2f4f7" stroke="#98a2b3" stroke-width="2"/><text x="46" y="175" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033" font-weight="bold" text-anchor="start">Inputs</text><text x="46" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Hardware event pulses</text><text x="46" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Raw W1C writes</text><text x="46" y="265" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Enable / line / injection</text><text x="46" y="287" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">fields</text><rect x="330" y="145" width="320" height="245" rx="12" fill="#eaf2ff" stroke="#84adff" stroke-width="2"/><text x="346" y="175" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#175cd3" font-weight="bold" text-anchor="start">Latch raw events</text><text x="346" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Sticky raw flags<