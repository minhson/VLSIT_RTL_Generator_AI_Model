<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc"><title id="title">Functional diagram of m_canfd_safe</title><desc id="desc">Inputs, main processing stages, outputs and clock domain for m_canfd_safe.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#101828" font-weight="bold" text-anchor="start">m_canfd_safe · Functional block diagram</text><text x="30" y="72" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475467" font-weight="normal" text-anchor="start">CLK-CAN + CLK-BUS  |  Monitor enabled safety mechanisms and apply configured reactions</text><rect x="30" y="145" width="260" height="245" rx="12" fill="#f2f4f7" stroke="#98a2b3" stroke-width="2"/><text x="46" y="175" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033" font-weight="bold" text-anchor="start">Inputs</text><text x="46" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">RAM / clock / register</text><text x="46" y="229" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">faults</text><text x="46" y="258" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Compare / signature</text><text x="46" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">mismatches</text><text x="46" y="309" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Fault injection inputs</text><rect x="330" y="145" width="320" height="245" rx="12" fill="#eaf2ff" stroke="#84adff" stroke-width="2"/><text x="346" y="175" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#175cd3" font-weight="bold" text-anchor="start">Mechanism checks</text><text x="346" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Parity / lock / clock</text><text x="346" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Counters / FSM / payload</text><rect x="700" y="145" width="320" height="245" rx="12" fill="#ecfdf3" stroke="#75e0a7" stroke-width="2"/><text x="716" y="175" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#067647" font-weight="bold" text-anchor="start">Collect and latch</text><text x="716" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Set detailed safety flags</text><text x="716" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Capture fault address / cause</text><rect x="1070" y="145" width="320" height="245" rx="12" fill="#f4f3ff" stroke="#bdb4fe" stroke-width="2"/><text x="1086" y="175" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5925dc" font-weight="bold" text-anchor="start">Apply reaction</text><text x="1086" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Report or set INIT</text><text x="1086" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Drive safety output / IRQ</text><rect x="1440" y="145" width="330" height="245" rx="12" fill="#fff6ed" stroke="#fec84b" stroke-width="2"/><text x="1456" y="175" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033" font-weight="bold" text-anchor="start">Outputs</text><text x="1456" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">o_saf_err</text><text x="1456" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Safety flags / IRQ</text><text x="1456" y="265" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344054" font-weight="normal" text-anchor="start">Optional stop request</text><path d="M290 270 L320 270" fill="none" stroke="#475467" stroke-width="2.4"/><polygon points="330,270 318,264 318,276" fill="#475467"/><path d="M650 270 L690 270" fill="none" stroke="#475467" stroke-width="2.4"/><polygon points="700,270 688,264 688,276" fill="#475467"/><path d="M1020 270 L1060 270" fill="none" stroke="#475467" stroke-width="2.4"/><polygon points="1070,270 1058,264 1058,276" fill="#475467"/><path d="M1390 270 L1430 270" fill="none" stroke="#475467" stroke-width="2.4"/><polygon points="1440,270 1428,264 1428,276" fill="#475467"/><text x="30" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#667085" font-weight="normal" text-anchor="start">Design intent from the HDS; module boundaries and signal names are defined in sections 6 and 14.</text><text x="30" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475467" font-weight="normal" text-anchor="start">Note: Functional boundary only. Full SM-12–SM-16 instance hierarchy is still open in section 14.2.</text></svg>