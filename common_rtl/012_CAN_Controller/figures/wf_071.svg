<text x="12" y="290" font-size="11" fill="#444">A CRC-error receiver does not acknowledge. CC starts its error flag at EOF bit 0. ISO FD starts its error flag after three bit-times following the CRC delimiter; dominant bus samples during that interval are ignored for error detection. Active error flag is shown; an error-passive node transmits recessive passive-flag bits. Field widths are schematic, not to scale. ISO 11898-1:2024 §6.6.21.3.1.</text>
