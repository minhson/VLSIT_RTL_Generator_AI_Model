<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="10" y="20" font-family="Times New Roman, serif"  font-size="16" font-weight="bold" text-anchor="start">Logic diagram of the error monitoring and fault confinement (m_canfd_bsp and m_canfd_eml, CLK-CAN)</text><rect x="20" y="60" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="120" y="80" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Bit monitor</text><text x="120" y="95" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">tx_bit != sample_val</text><text x="120" y="110" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">not in ARB field recessive, ACK slot</text><rect x="20" y="140" width="200" height="50" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="120" y="163" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Stuff checker</text><text x="120" y="177" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">6th equal bit, fixed stuff bit</text><rect x="20" y="210" width="200" height="50" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="120" y="233" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Form checker</text><text x="120" y="247" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">fixed-form bits illegal</text><rect x="20" y="280" width="200" height="50" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="120" y="303" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">CRC and stuff count check</text><text x="120" y="317" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">at the end of the CRC field</text><rect x="20" y="350" width="200" height="50" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="120" y="373" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">ACK checker</text><text x="120" y="387" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">no dominant in ACK slot</text><path d="M 220 90 L 290 90" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="290,90 281,94 281,86" fill="#000"/><path d="M 220 165 L 290 165" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="290,165 281,169 281,161" fill="#000"/><path d="M 220 235 L 290 235" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="290,235 281,239 281,231" fill="#000"/><path d="M 220 305 L 290 305" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="290,305 281,309 281,301" fill="#000"/><path d="M 220 375 L 290 375" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="290,375 281,379 281,371" fill="#000"/><rect x="290" y="60" width="180" height="340" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="380" y="190" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Error event encoder</text><text x="380" y="205" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">type: BIT, STUFF, FORM,</text><text x="380" y="220" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">ACK, CRC</text><text x="380" y="235" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">phase: arbitration or data</text><text x="380" y="250" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">role: transmitter or receiver</text><text x="380" y="265" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">first error of the frame</text><text x="380" y="280" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">sets last error code</text><path d="M 470 120 L 540 120" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="540,120 531,124 531,116" fill="#000"/><text x="475" y="112" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">error event</text><rect x="540" y="60" width="250" height="120" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="665" y="95" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Fault confinement counters (m_canfd_eml)</text><text x="665" y="110" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">TEC + 8 : transmitter flag (exc. 1, 2)</text><text x="665" y="125" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">REC + 1 : receiver error</text><text x="665" y="140" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">REC + 8 : dominant after flag; bit error in flag</text><text x="665" y="155" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">TEC - 1 / REC - 1 after success</text><rect x="540" y="220" width="250" height="90" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="665" y="248" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">State</text><text x="665" y="263" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">active: TEC, REC &lt; 128</text><text x="665" y="277" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">passive: either &gt;= 128</text><text x="665" y="292" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">bus-off: TEC &gt;= 256 (INIT set)</text><path d="M 665 180 L 665 220" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="665,220 661,211 669,211" fill="#000"/><text x="672" y="205" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">TEC, REC</text><rect x="540" y="350" width="250" height="60" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="665" y="378" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Bus-off recovery</text><text x="665" y="392" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">11 recessive bits x LPARA count</text><path d="M 665 310 L 665 350" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="665,350 661,341 669,341" fill="#000"/><rect x="850" y="60" width="190" height="100" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="945" y="93" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Error signaling control</text><text x="945" y="108" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">active flag 6 dominant</text><text x="945" y="122" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">passive flag 6 recessive</text><text x="945" y="137" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">delimiter 8 recessive</text><path d="M 790 120 L 850 110" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="850,110 845,123 837,115" fill="#000"/><text x="796" y="112" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">start flag</text><path d="M 790 265 L 820 265 L 820 130 L 850 130" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="850,130 841,134 841,126" fill="#000"/><text x="760" y="258" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">state</text><rect x="850" y="220" width="190" height="90" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="945" y="248" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Suspend / overload</text><text x="945" y="263" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">suspend: 8 bit times when</text><text x="945" y="277" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">passive and was transmitter</text><text x="945" y="292" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">overload: max 2 frames</text><path d="M 945 160 L 945 220" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="945,220 941,211 949,211" fill="#000"/><rect x="1080" y="60" width="140" height="100" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1150" y="93" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">o_can_tx override</text><text x="1150" y="108" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">flag, delimiter,</text><text x="1150" y="122" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">overload</text><text x="1150" y="137" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">to m_canfd_bsp</text><path d="M 1040 110 L 1080 110" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1080,110 1071,114 1071,106" fill="#000"/><rect x="1080" y="220" width="140" height="90" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1150" y="255" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Status to CSR</text><text x="1150" y="270" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">canfd_sts, canfd_ecnt,</text><text x="1150" y="285" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">canfd_lec, interrupts</text><path d="M 790 290 L 840 340 L 1130 340 L 1130 310" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1130,310 1134,319 1126,319" fill="#000"/><text x="20" y="560" font-family="Times New Roman, serif"  font-size="12"  text-anchor="start">Counter rules follow REF-001 section 7: rules 1 to 12 and exceptions 1 and 2. The counters and the state are duplicated and compared when PARA_CANFD_SAF_CNT_EN is set (SM-06).</text></svg>