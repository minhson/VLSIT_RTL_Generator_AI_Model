<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="10" y="20" font-family="Times New Roman, serif"  font-size="16" font-weight="bold" text-anchor="start">Logic diagram of the bit timing and sampling unit m_canfd_btl (CLK-CAN)</text><rect x="20" y="70" width="110" height="50" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="75" y="93" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">i_can_rx</text><text x="75" y="107" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">(pin, async)</text><rect x="170" y="70" width="130" height="50" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="235" y="85" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Two-flop</text><text x="235" y="100" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">synchronizer</text><text x="235" y="115" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">rx_s1, rx_s</text><rect x="340" y="70" width="140" height="50" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="410" y="93" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">rx_cur, rx_prev</text><text x="410" y="107" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">(registered)</text><path d="M 130 95 L 170 95" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="170,95 161,99 161,91" fill="#000"/><path d="M 300 95 L 340 95" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="340,95 331,99 331,91" fill="#000"/><rect x="340" y="170" width="200" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="440" y="195" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Edge detect</text><text x="440" y="210" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">rx_cur = 0, rx_prev = 1</text><text x="440" y="225" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">smp_q = 1, synced = 0</text><path d="M 410 120 L 410 170" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="410,170 406,161 414,161" fill="#000"/><text x="418" y="148" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">rx_cur, rx_prev</text><rect x="600" y="170" width="270" height="150" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="735" y="205" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Synchronization controller</text><text x="735" y="220" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">hard: hard_sync_en or hs_edl</text><text x="735" y="235" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">tx_dom and e &gt; 0: ignore (rule 4)</text><text x="735" y="250" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">no_resync (data phase): ignore (rule 5)</text><text x="735" y="265" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">e = t (SEG1) or e = -(len1+len2+1-t) (SEG2)</text><text x="735" y="280" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">|e| &lt;= sjw: restart | e &gt; sjw: len1 += sjw</text><text x="735" y="295" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">e &lt; -sjw: len2 -= sjw</text><path d="M 540 205 L 600 205" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="600,205 591,209 591,201" fill="#000"/><text x="548" y="198" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">edge</text><rect x="20" y="170" width="270" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="155" y="195" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Edge filter (option)</text><text x="155" y="210" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">2 consecutive dominant tq</text><text x="155" y="225" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">only while hard_sync_en</text><path d="M 290 205 L 340 205" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="340,205 331,209 331,201" fill="#000"/><rect x="600" y="380" width="270" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="735" y="410" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Segment decode</text><text x="735" y="425" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">SYNC: t = 0 | SEG1: t &lt;= len1</text><text x="735" y="440" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">SEG2: t &gt; len1, t &lt;= len1 + len2</text><rect x="20" y="330" width="200" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="120" y="355" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Prescaler div</text><text x="120" y="370" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">0 .. brp - 1</text><text x="120" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">tick = (div = brp - 1)</text><rect x="280" y="330" width="250" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="405" y="355" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">tq counter t</text><text x="405" y="370" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">increments on tick</text><text x="405" y="385" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">cell end: t = len1 + len2</text><path d="M 220 365 L 280 365" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="280,365 271,369 271,361" fill="#000"/><text x="238" y="358" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">tick</text><path d="M 530 365 L 600 420" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="600,420 587,415 595,407" fill="#000"/><text x="540" y="385" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">t, len1, len2</text><path d="M 735 320 L 735 380" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="735,380 731,371 739,371" fill="#000"/><text x="742" y="355" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">restart / len adjust</text><rect x="280" y="470" width="250" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="405" y="495" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Cell reload</text><text x="405" y="510" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">len1 = tseg1, len2 = tseg2</text><text x="405" y="525" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">of the configuration in use</text><path d="M 405 400 L 405 470" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="405,470 401,461 409,461" fill="#000"/><rect x="20" y="470" width="200" height="70" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="120" y="495" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Configuration mux</text><text x="120" y="510" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">ph = N: nominal registers</text><text x="120" y="525" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">ph = D: data registers</text><path d="M 220 505 L 280 505" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="280,505 271,509 271,501" fill="#000"/><text x="224" y="498" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">brp, tseg, sjw</text><path d="M 120 470 L 120 400" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="120,400 124,409 116,409" fill="#000"/><rect x="600" y="500" width="270" height="90" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="735" y="528" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Sample point and tx point</text><text x="735" y="543" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">sample = tick and t = len1:</text><text x="735" y="557" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">sample_val = rx_cur, smp_q = rx_cur,</text><text x="735" y="572" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">synced = 0 | tx_point = cell end</text><path d="M 735 460 L 735 500" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="735,500 731,491 739,491" fill="#000"/><rect x="930" y="380" width="220" height="80" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1040" y="410" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Bit rate switch</text><text x="1040" y="425" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">ph &lt;- D after the BRS sample</text><text x="1040" y="440" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">ph &lt;- N after the CRCd sample</text><path d="M 930 420 L 870 420" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="870,420 879,416 879,424" fill="#000"/><path d="M 870 545 L 930 545" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="930,545 921,549 921,541" fill="#000"/><rect x="930" y="500" width="220" height="90" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1040" y="535" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">To m_canfd_bsp</text><text x="1040" y="550" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">sample, sample_val,</text><text x="1040" y="565" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">tx_point, sync event</text><rect x="930" y="170" width="220" height="150" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1040" y="220" font-family="Times New Roman, serif"  font-size="13" font-weight="bold" text-anchor="middle">Secondary sample point (m_canfd_tdc)</text><text x="1040" y="235" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">delay counter: tx edge to rx edge</text><text x="1040" y="250" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">at the FDF to res edge</text><text x="1040" y="265" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">ssp = delay + tdco after tx_point</text><text x="1040" y="280" font-family="Times New Roman, serif"  font-size="13"  text-anchor="middle">bit error test at ssp</text><path d="M 870 245 L 930 245" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="930,245 921,249 921,241" fill="#000"/><text x="878" y="238" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">sync event</text><path d="M 1040 500 L 1040 460" fill="none" stroke="#000" stroke-width="1.4"/><polygon points="1040,460 1044,469 1036,469" fill="#000"/><text x="1048" y="485" font-family="Times New Roman, serif"  font-size="11"  text-anchor="start">sample</text><text x="20" y="620" font-family="Times New Roman, serif"  font-size="12"  text-anchor="start">Clock: i_clk_can only. Strobes (tick, sample, tx_point) are one-clock pulses. Registers: div, t, len1, len2, ph, smp_q, synced.</text></svg>