<text x="536.0" y="166.0" text-anchor="middle" font-size="11">PASSIVE</text>
<text x="12" y="200" font-size="11" fill="#444">Events, not bits. A receiver error adds 1 to REC, an error of the transmitter adds 8 to TEC, a successful frame subtracts 1. The transmit error counter reaching 128 makes the node error passive; the error that causes it still gets an active error flag, the next error flag is 6 recessive bits and it waits 8 bit times after the intermission before it sends again (REF-001 section 7).</text>
